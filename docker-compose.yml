services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet_reliability_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_dev_pw
      POSTGRES_DB: fleet_reliability
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_reliability"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
